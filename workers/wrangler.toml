name = "cfal3-grader"
main = "grader-proxy-worker.js"
compatibility_date = "2025-01-01"

# Structured log retention so `wrangler tail` is not the only way to see abuse.
[observability]
enabled = true

# Tunable caps. These are plain vars, not secrets — they are not sensitive,
# and keeping them here means changing a ceiling is a diff, not a dashboard
# click nobody remembers making. Lower them freely; the app never reads them.
[vars]
DAILY_USD = "5"
MONTHLY_USD = "25"
DAILY_REQUESTS = "40"
MAX_BODY_BYTES = "65536"

# Strongly-consistent spend counters. KV would be eventually consistent, and a
# spend cap that concurrent requests can race is not a cap.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]
