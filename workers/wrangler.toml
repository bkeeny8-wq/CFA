name = "cfal3-grader"
main = "grader-proxy-worker.js"
compatibility_date = "2025-01-01"

# Keeps the console log lines (unauthorized attempts, upstream errors)
# queryable without leaving `wrangler tail` running.
[observability]
enabled = true

# Migration history is cumulative, so v1 has to stay even though the class is
# gone — v2 is what actually removes it. The spend ledger it backed was
# dropped deliberately: Anthropic's own workspace spend limit enforces the
# ceiling for free and holds even if this worker is wrong.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[[migrations]]
tag = "v2"
deleted_classes = ["Ledger"]
